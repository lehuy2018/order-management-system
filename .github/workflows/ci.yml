name: CI/CD - Build WAR, Docker image, push to Docker Hub

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # tránh warning Node 20 (có thể bỏ nếu không muốn)

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'        # Eclipse Temurin (OpenJDK)
          cache: maven                   # cache Maven dependencies

      - name: Build WAR with Maven
        run: mvn clean package

      # (Tuỳ chọn) Liệt kê file WAR để debug
      - name: List target directory
        run: ls -l target/

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: huylv5
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t huylv5/order-management:latest .

      - name: Push Docker image to Docker Hub
        run: |
          docker push huylv5/order-management:latest